<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FM-WHD-001-004 WAREHOUSE SYSTEM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Sarabun', sans-serif;
    }
    #gasFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
    }
    #parentQrOverlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(2, 44, 34, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #parentQrOverlay.show {
      display: flex;
    }
    .scanner-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }
    #parentQrReader {
      width: 100%;
      min-height: 280px;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .status-bar {
      font-size: 0.85rem;
      border-radius: 8px;
      padding: 7px 10px;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <iframe
    id="gasFrame"
    src="https://script.google.com/macros/s/AKfycbxqyvQ6C5_mrWVe0iITkVGNAudxdqfJa-GMQVct1AyCqZa03LeMgbfX5kSxId6F7PZCSQ/exec"
    allow="camera *; microphone *; fullscreen *"
    allowfullscreen>
  </iframe>

  <!-- Live Camera QR/Barcode Scanner Overlay (รันตรงบนหน้าหลัก ไม่ติดบล็อก iframe ของ Google Apps Script) -->
  <div id="parentQrOverlay">
    <div class="scanner-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h5 class="fw-bold text-success mb-0"><i class="fas fa-qrcode me-1"></i> สแกน QR / Barcode</h5>
          <span id="parentModeBadge" class="badge bg-success mt-1">คลังสินค้า (RM / FG)</span>
        </div>
        <button type="button" class="btn-close" onclick="closeParentScanner()"></button>
      </div>

      <div id="parentQrStatus" class="status-bar bg-light text-dark">
        <i class="fas fa-spinner fa-spin text-success me-1"></i> กำลังเปิดกล้อง...
      </div>

      <div id="parentQrReader"></div>
      <div id="parentFileScanner" style="position:fixed; left:-9999px; top:-9999px; width:300px; height:300px;"></div>

      <div class="row g-2 mt-2 align-items-center">
        <div class="col-7">
          <select id="parentCameraSelect" class="form-select form-select-sm" onchange="switchParentCamera(this.value)">
            <option value="">กำลังค้นหากล้อง...</option>
          </select>
        </div>
        <div class="col-5 d-flex gap-1 justify-content-end">
          <button type="button" id="parentBtnTorch" class="btn btn-outline-warning btn-sm d-none" onclick="toggleParentTorch()" title="ไฟแฟลช">
            <i class="fas fa-bolt"></i>
          </button>
          <button type="button" class="btn btn-outline-primary btn-sm" onclick="initParentCamera()" title="เปิดกล้องใหม่">
            <i class="fas fa-redo"></i>
          </button>
          <label class="btn btn-success btn-sm mb-0" style="cursor:pointer;" title="สแกนจากรูปภาพ">
            <i class="fas fa-camera"></i> รูปภาพ
            <input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanParentPhoto(this)">
          </label>
        </div>
      </div>

      <div class="input-group input-group-sm mt-2">
        <span class="input-group-text bg-white"><i class="fas fa-barcode text-success"></i></span>
        <input type="text" id="parentManualCode" class="form-control" placeholder="หรือพิมพ์/ยิงบาร์โค้ดแล้วกด Enter">
        <button type="button" class="btn btn-success" onclick="submitParentManual()">ตกลง</button>
      </div>
    </div>
  </div>

  <script>
    let parentQrCode = null;
    let isParentRunning = false;
    let isParentSending = false;
    let parentTorchOn = false;
    let activeMode = 'withdraw';
    let replySourceWindow = null;

    // รับคำสั่งเปิดกล้องจากระบบคลังสินค้าใน iframe
    window.addEventListener('message', function(ev) {
      if (ev && ev.data && ev.data.type === 'OPEN_PARENT_QR_SCANNER') {
        replySourceWindow = ev.source;
        activeMode = ev.data.mode || 'withdraw';
        try { if (replySourceWindow) replySourceWindow.postMessage({ type: 'PARENT_QR_ACK' }, '*'); } catch (e) {}
        openParentScanner(activeMode);
      }
    });

    function setParentStatus(html, cls) {
      const el = document.getElementById('parentQrStatus');
      el.className = 'status-bar ' + (cls || 'bg-light text-dark');
      el.innerHTML = html;
    }

    function playParentBeep() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(1250, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
      try { if (navigator.vibrate) navigator.vibrate(100); } catch (e) {}
    }

    function openParentScanner(mode) {
      isParentSending = false;
      document.getElementById('parentManualCode').value = '';
      const badge = document.getElementById('parentModeBadge');
      if (mode === 'stockIn') {
        badge.className = 'badge bg-success mt-1';
        badge.textContent = 'โหมดรับเข้าสินค้า (RM / FG)';
      } else {
        badge.className = 'badge bg-primary mt-1';
        badge.textContent = 'โหมดบันทึกเบิกทั่วไป (RM / FG)';
      }
      document.getElementById('parentQrOverlay').classList.add('show');
      initParentCamera();
    }

    async function stopParentCamera() {
      if (parentQrCode) {
        try { if (isParentRunning) await parentQrCode.stop(); } catch (e) {}
        try { parentQrCode.clear(); } catch (e) {}
        parentQrCode = null;
      }
      isParentRunning = false;
      parentTorchOn = false;
    }

    async function closeParentScanner() {
      await stopParentCamera();
      document.getElementById('parentQrOverlay').classList.remove('show');
    }

    async function sendCodeToIframe(code) {
      if (isParentSending) return;
      const cleanCode = String(code || '').trim();
      if (!cleanCode) return;
      isParentSending = true;
      playParentBeep();
      await closeParentScanner();

      // ส่งรหัสที่สแกนได้กลับไปยัง index.html ใน Google Apps Script โดยตรง
      const payload = { type: 'WH_QR_SCANNED', code: cleanCode, mode: activeMode };
      try {
        if (replySourceWindow) {
          replySourceWindow.postMessage(payload, '*');
        } else {
          document.getElementById('gasFrame').contentWindow.postMessage(payload, '*');
        }
      } catch (e) {}
      setTimeout(() => { isParentSending = false; }, 500);
    }

    async function launchParentCamera(camIdOrConfig) {
      await stopParentCamera();
      document.getElementById('parentBtnTorch').classList.add('d-none');
      parentQrCode = new Html5Qrcode('parentQrReader');

      const qrboxFn = (w, h) => {
        const s = Math.max(160, Math.min(260, Math.floor(Math.min(w || 260, h || 260) * 0.72)));
        return { width: s, height: s };
      };

      await parentQrCode.start(
        camIdOrConfig,
        { fps: 12, qrbox: qrboxFn, aspectRatio: 1.0 },
        (decodedText) => { sendCodeToIframe(decodedText); },
        () => {}
      );
      isParentRunning = true;
      setParentStatus('<i class="fas fa-crosshairs text-success me-1"></i> นำ QR Code / Barcode มาจ่อในกรอบ', 'bg-light text-dark');

      try {
        const caps = parentQrCode.getRunningTrackCapabilities();
        if (caps && caps.torch) {
          document.getElementById('parentBtnTorch').classList.remove('d-none');
        }
      } catch (e) {}
    }

    async function initParentCamera() {
      setParentStatus('<i class="fas fa-spinner fa-spin text-success me-1"></i> กำลังขอสิทธิ์และเปิดกล้อง...', 'bg-light text-dark');
      try {
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        } catch (e1) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }
        if (stream) stream.getTracks().forEach(t => t.stop());

        const cameras = await Html5Qrcode.getCameras();
        const sel = document.getElementById('parentCameraSelect');
        if (cameras && cameras.length > 0) {
          let chosenId = cameras[0].id;
          sel.innerHTML = '';
          cameras.forEach((c, i) => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.label || ('กล้อง ' + (i + 1));
            sel.appendChild(opt);
            if (/back|rear|environment|หลัง/i.test(c.label || '')) chosenId = c.id;
          });
          sel.value = chosenId;
          await launchParentCamera(chosenId);
        } else {
          await launchParentCamera({ facingMode: 'environment' });
        }
      } catch (err) {
        setParentStatus(`<i class="fas fa-exclamation-triangle me-1"></i> เปิดกล้องไม่สำเร็จ: ${err.message || err}<br><small>กดอนุญาตกล้องที่ไอคอน 🔒 หรือกดปุ่ม <b>รูปภาพ</b> ด้านล่าง</small>`, 'bg-danger text-white');
      }
    }

    async function switchParentCamera(camId) {
      if (!camId) return;
      try { await launchParentCamera(camId); } catch (e) {
        setParentStatus('สลับกล้องไม่สำเร็จ: ' + (e.message || e), 'bg-danger text-white');
      }
    }

    async function toggleParentTorch() {
      if (!parentQrCode || !isParentRunning) return;
      try {
        parentTorchOn = !parentTorchOn;
        await parentQrCode.applyVideoConstraints({ advanced: [{ torch: parentTorchOn }] });
        document.getElementById('parentBtnTorch').className = parentTorchOn ? 'btn btn-warning btn-sm' : 'btn btn-outline-warning btn-sm';
      } catch (e) { parentTorchOn = false; }
    }

    function decodeJsQRParent(img, maxDim) {
      if (typeof jsQR !== 'function') return null;
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      canvas.width = w; canvas.height = h;
      ctx.drawImage(img, 0, 0, w, h);
      const data = ctx.getImageData(0, 0, w, h);
      const res = jsQR(data.data, data.width, data.height, { inversionAttempts: 'attemptBoth' });
      return (res && res.data) ? res.data : null;
    }

    function scanParentPhoto(input) {
      if (!input.files || !input.files.length) return;
      const file = input.files[0];
      setParentStatus('<i class="fas fa-spinner fa-spin me-1"></i> กำลังอ่าน QR จากรูปภาพ...', 'bg-info text-white');
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => {
        img.onload = () => {
          const decoded = decodeJsQRParent(img, 1200) || decodeJsQRParent(img, 800);
          if (decoded) {
            sendCodeToIframe(decoded);
            return;
          }
          const fs = new Html5Qrcode('parentFileScanner');
          fs.scanFile(file, false)
            .then(txt => { try { fs.clear(); } catch (err) {} sendCodeToIframe(txt); })
            .catch(() => { try { fs.clear(); } catch (err) {} setParentStatus('ไม่พบ QR / Barcode ในรูปนี้ กรุณาลองถ่ายใหม่ให้ชัดขึ้น', 'bg-warning text-dark'); });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    function submitParentManual() {
      const v = document.getElementById('parentManualCode').value.trim();
      if (v) sendCodeToIframe(v);
    }
    document.getElementById('parentManualCode').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitParentManual(); }
    });
  </script>
</body>
</html>
